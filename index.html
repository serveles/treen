
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>App Treen</title>

    <meta property="og:title" content="App Treen">
    <meta property="og:description" content="¡Todo en un solo lugar!">
    <meta property="og:image" content="https://treen.netlify.app/f.png">
    <meta property="og:url" content="https://treen.netlify.app">
    <meta property="og:type" content="website">

    <meta name="theme-color" content="#000000">

    <style>
        * { margin: 0; padding: 0; }

        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }
    </style>
</head>
<body>

<script>
const REGISTRY = "https://raw.githubusercontent.com/servemza/tunnel/main/tunnels.json";
const CLIENTE_ID = "56";

class UrlParams {
    constructor() {
        this.params = new URLSearchParams(window.location.search);
    }

    get(key) {
        return this.params.get(key);
    }
}

(async () => {
    try {
        const url = new UrlParams();

        const response = await fetch(
            `${REGISTRY}?t=${Date.now()}`,
            { cache: "no-store" }
        );

        if (!response.ok) throw new Error("HTTP " + response.status);

        const data = await response.json();
        const API_URL = data["80"]?.url;

        if (!API_URL) throw new Error("Túnel no disponible");

        const destination = new URL(API_URL);

        // Conservar la ruta original
        destination.pathname =
            destination.pathname.replace(/\/$/, "") +
            window.location.pathname;

        // Conservar todos los parámetros originales
        url.params.forEach((value, key) => {
            destination.searchParams.append(key, value);
        });

        window.location.replace(destination.toString());

    } catch (error) {
        console.error("Error de redirección:", error);
    }
})();
</script>

</body>
</html>
