<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>App Treen</title>

    <meta property="og:title" content="App Treen">
    <meta property="og:description" content="¡Todo en un solo lugar!">
    <meta property="og:image" content="https://treens.pages.dev/f.png">
    <meta property="og:url" content="https://treens.pages.dev">
    <meta property="og:type" content="website">

    <meta name="theme-color" content="#000000">

    <style>
        * { margin: 0; padding: 0; }

        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        #app {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            background: #000;
        }

        #msg {
            position: fixed;
            inset: 0;
            display: none;
            place-items: center;
            color: #888;
            font: 14px system-ui, sans-serif;
            text-align: center;
        }
    </style>
</head>
<body>

<iframe id="app" title="Treen"
        allow="fullscreen; autoplay; clipboard-write; encrypted-media; picture-in-picture"
        allowfullscreen></iframe>
<div id="msg">No se pudo conectar. Intenta de nuevo en unos minutos.</div>

<script>
const REGISTRY = "https://raw.githubusercontent.com/servemza/tunnel/main/tunnels.json";
const CLIENTE_ID = "56";

const frame = document.getElementById("app");

(async () => {
    try {
        const response = await fetch(
            `${REGISTRY}?t=${Date.now()}`,
            { cache: "no-store" }
        );

        if (!response.ok) throw new Error("HTTP " + response.status);

        const data = await response.json();
        const API_URL = data["8085"]?.url;

        if (!API_URL) throw new Error("Túnel no disponible");

        const destination = new URL(API_URL);
        const origenApp = destination.origin;

        // Conservar la ruta, los parámetros y el hash originales
        destination.pathname =
            destination.pathname.replace(/\/$/, "") +
            window.location.pathname;
        destination.search = window.location.search;
        destination.hash = window.location.hash;

        // La app (dentro del iframe) avisa su ruta al terminar de cargar:
        // aquí solo se actualiza la barra de este dominio (sin recargar ni navegar).
        window.addEventListener("message", (e) => {
            if (e.origin !== origenApp || e.source !== frame.contentWindow) return;
            const d = e.data;
            if (!d || d.tipo !== "treen-url") return;

            const path   = String(d.path || "/");
            const search = String(d.search || "");
            const hash   = String(d.hash || "");
            if (!/^\/(?!\/)/.test(path)) return;
            if (search && search[0] !== "?") return;
            if (hash && hash[0] !== "#") return;

            const nueva = path + search + hash;
            if (nueva !== location.pathname + location.search + location.hash) {
                history.replaceState(null, "", nueva);
            }
            if (typeof d.title === "string" && d.title) {
                document.title = d.title.slice(0, 200);
            }
        });

        frame.src = destination.toString();

    } catch (error) {
        console.error("Error de conexión:", error);
        document.getElementById("msg").style.display = "grid";
        frame.style.display = "none";
    }
})();
</script>

</body>
</html>
